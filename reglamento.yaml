# ============================================================================
# REGLAMENTO DE SOBREVIVIENTE PRO — la ÚNICA fuente de verdad
# Cada valor que el sistema usa para decidir vive aquí. Si cambias algo,
# sube la versión y anótalo en CAMBIOS.md (solo en la ventana semanal).
# ============================================================================

version: "2.0.1"                       # Versión del reglamento; va en cada boleto y reporte. 2.0.x = v2 "MAREA".
zona_horaria: "America/Mexico_City"    # Hora de Celaya/CDMX para días, semanas y reportes.

riesgo:
  riesgo_por_operacion_pct: 1.0        # Cuánto del capital total se arriesga en cada operación (si toca el stop). Decidido por Ángelo.
  riesgo_por_estrategia_pct:           # Excepciones: estrategias con riesgo reducido.
    E3: 0.5                            # Reversión en rango: la mitad, porque es más frágil.
    E4: 0.5                            # Memes: la mitad, porque son muy volátiles.
  calor_total_max_pct: 3.0             # Suma máxima del riesgo de TODO lo abierto a la vez.
  exposicion_max_posicion_spot_pct: 30.0  # Ninguna posición de Spot puede valer más del 30 % del capital.
  cubeta_memes_max_pct: 10.0           # Todas las memes juntas no pueden valer más del 10 % del capital.
  futuros:
    margen: "AISLADO"                  # Siempre margen aislado (una pérdida no se come toda la cuenta). Nunca cruzado.
    apalancamiento_max: 2              # Máximo 2x. El sistema nunca permite más (regla de la sección 19).
    margen_total_max_pct: 25.0         # El margen de todos los futuros no puede pasar del 25 % del capital.
    colchon_liquidacion: 2.0           # El precio de liquidación debe estar al menos 2 veces más lejos que el stop.
    tasa_mantenimiento_pct: 0.5        # Margen de mantenimiento supuesto para estimar la liquidación (Binance: ~0.4–1 %).
  posiciones_max:
    normales: 3                        # Máximo 3 posiciones de monedas normales en Spot.
    memes: 2                           # Máximo 2 posiciones de memes.
    futuros: 1                         # Máximo 1 posición en Futuros.
  tope_diario_pct: 3.0                 # Si en el día se pierde 3 % del capital → PAUSA hasta mañana (CDMX). Decidido por Ángelo.
  tope_semanal_pct: 6.0                # Si en la semana se pierde 6 % → PAUSA hasta el lunes. Decidido por Ángelo.
  caida_max_desde_pico_pct: 15.0       # Si el capital cae 15 % desde su máximo → todo se detiene hasta que Ángelo dé el OK.
  rachas:
    perdidas_para_saltar: 3            # Si una estrategia pierde 3 veces seguidas...
    rondas_a_saltar: 1                 # ...se salta 1 ronda.
    surfista_perdidas: 2               # Memes (E4): con 2 pérdidas seguidas...
    surfista_pausa_horas: 24           # ...pausa de 24 horas.
  eventos:
    minutos_antes: 30                  # Sin entradas nuevas 30 minutos antes de un evento fuerte...
    minutos_despues: 30                # ...ni 30 minutos después.
    importancia_minima: "ALTA"         # Solo los eventos de importancia ALTA bloquean entradas.
  costos:
    multiplo_minimo: 3.0               # La ganancia hasta la meta debe ser al menos 3 veces lo que cuesta entrar y salir.
    meta_nominal_r: 2.0                # Para estrategias sin meta fija (salen con stop dinámico) se usa 2R como meta para esta revisión.
  gestion:
    mover_a_entrada_en_r: 1.0          # Valor por defecto: cuando la operación va +1R, el stop sube a la entrada más costos.
                                       # v2: es POR ESTRATEGIA. Cada estrategia puede apagarlo con `mover_a_entrada: false` (M0, M1 y M2 lo tienen apagado).
  ajustes:
    btc_bajista_factor_memes: 0.5      # Con BTC BAJISTA las memes arriesgan la mitad.
    vol_alta_percentil: 80             # Volatilidad arriba del percentil 80 = ALTA...
    vol_alta_factor: 0.5               # ...y el riesgo se corta a la mitad.
    vol_extrema_percentil: 95          # Arriba del percentil 95 = EXTREMA: sin entradas nuevas.
    vol_baja_percentil: 20             # Abajo del percentil 20 = BAJA (solo informativo).

costos:
  comision_spot_pct: 0.10              # Comisión de Spot por lado (supuesto conservador si el conector no da la real).
  comision_en_moneda_comprada: true    # Binance Spot cobra la comisión de la compra en la moneda que recibes: el stop y la
                                       # venta van por la cantidad NETA. false solo si Ángelo confirma que paga con BNB.
  comision_futuros_maker_pct: 0.02     # Comisión de Futuros cuando tu orden espera en el libro.
  comision_futuros_taker_pct: 0.05     # Comisión de Futuros cuando tu orden se llena al instante (el backtest usa esta, por prudencia).
  deslizamiento_pct:                   # Diferencia típica entre el precio que quieres y el que te dan.
    grande: 0.05                       # Monedas muy líquidas.
    mediana: 0.10                      # Monedas de liquidez media.
    meme: 0.30                         # Memes.
  volumen_grande_min_usdt: 200000000   # Volumen mediano diario desde el cual una moneda cuenta como "grande".

universo:
  cotizacion: "USDT"                   # Solo pares contra USDT.
  volumen_mediano_min_usdt: 10000000   # Volumen mediano diario mínimo (últimos 30 días).
  dias_volumen: 30                     # Días que se usan para calcular ese volumen mediano.
  dias_listada_min: 30                 # La moneda debe tener al menos 30 días listada.
  futuros_volumen_min_usdt: 50000000   # Volumen mediano mínimo del perpetuo para operar Futuros.
  stablecoins: [USDC, FDUSD, TUSD, BUSD, DAI, USDP, PAX, USDD, PYUSD, EURI, AEUR, USDS, USDSB, UST, USTC, SUSD, GUSD, FRAX, LUSD, XUSD, BFUSD, USD1, RLUSD, USDE, U, PAXG, XAUT]  # Monedas estables y de oro: no se operan.
  fiat: [EUR, GBP, TRY, BRL, AUD, RUB, UAH, NGN, ZAR, IDRT, BIDR, BKRW, JPY, MXN, ARS, PLN, RON, COP, CZK]  # Monedas de gobierno: no se operan.
  sufijos_apalancados: [UP, DOWN, BULL, BEAR]  # Tokens apalancados: fuera.
  excluir_bases: []                    # Activos que NO son cripto y se excluyen siempre (p. ej. acciones tokenizadas SNDKB, SOXLB, SPCXB). PENDIENTE: decide Ángelo.
  grandes_n: 15                       # v2: universo "grandes" = las 15 con más volumen mediano de 30 días (día por día, sin memes ni estables).
  canasta_n: 10                        # v2: la referencia R2 usa las 10 más grandes de ese grupo.

regimen:
  btc_simbolo: "BTCUSDT"               # El termómetro del mercado.
  ema: 200                             # Media móvil exponencial de 200 velas de 4 horas.
  pendiente_velas: 20                  # La pendiente se mide contra la EMA de hace 20 velas.
  pendiente_umbral_pct: 1.0            # La EMA debe haber subido (o bajado) más de 1 % para contar como tendencia.
  atr_periodo: 14                      # ATR = tamaño promedio de las velas (14 velas).
  vol_ventana_dias: 90                 # Para el percentil de volatilidad se comparan los últimos 90 días.
  diario:                              # v2: "marea" diaria de BTC (aparte del régimen de 4 h, que se queda para la v1).
    sma_btc_dias: 200                  # Marea ALTA si el cierre diario de BTC está arriba de su media de 200 días; si no, BAJA.

estrategias:                           # Estado: APAGADA → PAPEL → VIVA_MINI → VIVA. Nadie sube sin pasar compuertas.
  E1:
    nombre: "Ruptura de tendencia"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "4h"
    parametros: {donchian_n: 40, stop_atr: 2.5, chandelier_atr: 3.0}   # Velas del canal, ATR del stop inicial, ATR del stop dinámico.
    rejilla: {donchian_n: [20, 40, 55], stop_atr: [2.0, 2.5, 3.0], chandelier_atr: [3.0, 4.0]}  # Valores que el walk-forward puede elegir.
  E2:
    nombre: "Retroceso en tendencia"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1h"
    parametros: {rsi_reset: 40, stop_atr: 2.0, chandelier_atr: 3.0}    # Nivel de RSI que cuenta como "reseteo", ATR del stop, ATR del stop dinámico.
    rejilla: {rsi_reset: [35, 40, 45], stop_atr: [1.5, 2.0, 2.5], chandelier_atr: [3.0]}
  E3:
    nombre: "Reversión en rango"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "4h"
    parametros: {rsi2_max: 10, stop_atr: 2.0, salida_media: 5}         # RSI(2) máximo para entrar, ATR del stop, media a la que se sale.
    rejilla: {rsi2_max: [5, 10, 15], stop_atr: [1.5, 2.0, 2.5], salida_media: [5, 10]}
  E4:
    nombre: "Surfista (memes)"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "memes"
    temporalidad: "1h"
    parametros: {vol_mult: 3.0, respiro_pct: 3.0, stop_atr: 2.0}       # Veces el volumen promedio, % de respiro desde el máximo, ATR del stop.
    rejilla: {vol_mult: [2.5, 3.0, 4.0], respiro_pct: [2.0, 3.0, 5.0], stop_atr: [2.0, 3.0]}
    fijos: {subida_max_24h_pct: 40, stop_max_pct: 15, horas_max: 24, fuerza_percentil: 90}  # Reglas fijas de la especificación (no se optimizan).
    permitir_vivo: true                # Decidido por Ángelo: memes pueden ir a dinero real SOLO si pasan todas las compuertas.
  E5:
    nombre: "Francotirador (cortos)"
    estado: "APAGADA"
    mercado: "FUTUROS"
    lado: "CORTO"
    cubeta: "futuros"
    temporalidad: "4h"
    parametros: {donchian_n: 40, stop_atr: 2.5, chandelier_atr: 3.0, funding_min_pct: -0.05}  # Canal, ATR del stop, ATR dinámico, funding mínimo aceptado.
    rejilla: {donchian_n: [20, 40, 55], stop_atr: [2.0, 2.5, 3.0], chandelier_atr: [3.0, 4.0], funding_min_pct: [-0.05]}
    apalancamiento: 2                  # Apalancamiento de E5 (nunca más que riesgo.futuros.apalancamiento_max).
  # ---------------- RONDA 2 (pedida por Ángelo el 10 nov 2026) ----------------
  E1D:
    nombre: "E1 corregida (diaria)"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    mover_a_entrada: false             # Excepción pedida por Ángelo: NO subir el stop a la entrada en +1R, para dejar correr las ganadoras.
    parametros: {donchian_n: 20, stop_atr: 3.0, chandelier_atr: 5.0}   # Canal en días, ATR diario del stop, ATR diario del stop dinámico (más amplio).
    rejilla: {donchian_n: [20, 55], stop_atr: [2.0, 3.0], chandelier_atr: [4.0, 6.0]}
  E6:
    nombre: "Tendencia larga BTC/ETH"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    mover_a_entrada: false             # La salida normal es cuando el precio cierra abajo de la media de 200 días.
    parametros: {sma: 200, stop_atr: 4.0}  # Días de la media (fijo en 200, como pidió Ángelo) y ATR del stop de protección.
    rejilla: {sma: [200], stop_atr: [3.0, 5.0]}
  E7:
    nombre: "Rotación por momentum"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    mover_a_entrada: false             # Sale en el rebalanceo semanal si deja de estar entre las 3 más fuertes.
    parametros: {ventana: 60, stop_atr: 4.0}  # Días para medir la fuerza y ATR del stop de protección. Top 3 fijo (máximo de posiciones).
    rejilla: {ventana: [30, 60, 90], stop_atr: [3.0, 5.0]}
  # ---------------- v2 "MAREA" (9 nov 2026). Rejillas PRE-REGISTRADAS: no se agregan más. Máximo 1 ronda de ajustes. ----------------
  M0:
    nombre: "Marea BTC (R1)"
    estado: "PAPEL"                    # 10 nov 2026: ningún motor le ganó a R1 → M0 corre en PAPEL como línea base (regla de la v2). Ver VALIDACION_V2.md.
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    universo: "BTC"
    mover_a_entrada: false
    parametros: {sma: 200}             # Dentro de BTC si su cierre diario está arriba de la media de 200 días; si no, en USDT.
    rejilla: {sma: [200]}              # Fija: es la referencia R1 tal cual.
    fijos: {stop_pct: 15}              # Stop de CATÁSTROFE en Binance (15 %, el tope de M1) para que el motor de riesgo calcule el tamaño.
  M1:
    nombre: "MAREA (tendencia de cada moneda)"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    universo: "grandes"
    mover_a_entrada: false             # Sin "+1R → entrada": se deja correr.
    parametros: {n: 50}                # Entra al romper el máximo de n días (con marea alta); sale al perder el mínimo de n/2 días.
    rejilla: {n: [20, 50, 100]}
    fijos: {stop_max_pct: 15}          # El stop real (mínimo de n/2 días) nunca queda a más de 15 % de la entrada.
  M2:
    nombre: "RANKING (las más fuertes)"
    estado: "APAGADA"
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    universo: "grandes"
    mover_a_entrada: false
    parametros: {L: 30}                # Días con los que se mide la fuerza.
    rejilla: {L: [21, 30, 60]}
    fijos: {sma: 100, top_entrada: 3, top_salida: 6, stop_pct: 20}  # Media de 100 días, entra top 3, sale fuera del top 6, stop de catástrofe 20 %.
  M3:
    nombre: "ESTELA (posicionamiento de top traders)"
    estado: "APAGADA"                  # Primero es un ESTUDIO. Solo se usa como veto si el estudio muestra efecto.
    mercado: "SPOT"
    lado: "LARGO"
    cubeta: "normales"
    temporalidad: "1d"
    universo: "grandes"
    mover_a_entrada: false
    parametros: {D: 3, z: 1.0}
    rejilla: {D: [3, 7], z: [1.0, 1.5]}
    fijos: {ventana_z: 90, percentil_masa: 90, horizontes: [3, 7], min_anios_mismo_signo_pct: 70}
    veto_activo: false                 # 10 nov 2026: el estudio pasó en H2 a 3 días, pero con el veto ni M1 ni M2 pasan (M1 empeora):
                                       # no hay motor al que aplicarlo, así que sigue apagado. Ver VALIDACION_V2.md, ESTELA Paso 2.

datos:
  url_principal: "https://api.binance.com"          # API oficial de Binance (Spot).
  url_respaldo: "https://data-api.binance.vision"   # Respaldo oficial solo de datos de mercado.
  url_futuros: "https://fapi.binance.com"           # API oficial de Futuros USDⓈ-M.
  url_historicos: "https://data.binance.vision"     # Archivo histórico oficial de Binance (incluye monedas deslistadas).
  cache_exchangeinfo_horas: 24         # Las reglas del exchange se vuelven a leer cada 24 horas.
  max_velas_atraso: 2                  # Si los datos tienen más de 2 velas de atraso, no se opera.
  salto_absurdo_pct: 60                # Un cambio de más de 60 % en una vela de 1 hora se considera precio absurdo y se revisa.
  max_huecos_pct: 1.0                  # Si faltan más del 1 % de las velas recientes, los datos no son confiables.
  inicio_historicos: "2021-09-01"      # Desde cuándo se descargan los históricos (calentamiento para 2022).
  carpeta: "datos"                     # Carpeta de datos y archivos de coordinación.

backtest:
  inicio: "2022-01-01"                 # Inicio del periodo que se evalúa.
  fin: "2026-10-31"                    # Último día con datos mensuales completos.
  capital_ventaja: 10000               # Capital grande para medir si la estrategia tiene ventaja sin que estorben los mínimos.
  capital_real: 46.18                  # Capital real de Ángelo, para medir cuántas operaciones se saltarían.
  minimo_respaldo_usdt: 5.0            # SOLO backtest: mínimo supuesto para monedas deslistadas sin reglas disponibles.

validacion:
  holdout_meses: 6                     # Los últimos 6 meses son la prueba final intocable.
  wf_entrenamiento_meses: 12           # Walk-forward: 12 meses para elegir parámetros...
  wf_prueba_meses: 3                   # ...y 3 meses para probarlos sin tocarlos.
  wf_min_operaciones_entrenamiento: 20 # Si una combinación tiene menos de 20 operaciones en entrenamiento no se elige.
  montecarlo_n: 10000                  # Remuestreos de Monte Carlo.
  azar_n: 1000                         # Simulaciones con entradas al azar.
  robustez_variacion_pct: 20           # Los parámetros se mueven ±20 % para ver si el resultado aguanta.
  max_rondas_ajuste: 3                 # Máximo 3 rondas de ajustes por estrategia (regla contra el sobreajuste).
  semilla: 20261109                    # Semilla fija: los números al azar salen iguales cada vez (determinismo).
  ronda2:
    sin_holdout: true                  # La prueba final de mayo–octubre 2026 ya se abrió: ahora es una ventana más. Noviembre 2026 en adelante = papel.
    ideas_probadas: 8                  # 5 de la ronda 1 + 3 de la ronda 2. Más ideas probadas = más exigencia.
    azar_base_pct: 10                  # Antes: superar al 90 % del azar. Ahora: superar al 100 − 10/8 = 98.75 %.
    confianza_base: 0.05               # Piso del intervalo de confianza con 1 − 0.05/8 = 99.4 % debe ser mayor que 0R.
  lentos:                              # v2: compuertas para motores lentos (velas diarias). Escritas ANTES de ver resultados.
    min_operaciones_oos: {M1: 60, M2: 40}  # Operaciones fuera de muestra (M1: todas las monedas juntas). M0 se evalúa como cartera.
    ventanas_positivas_min_pct: 40     # Antes 60 %: las ganancias de tendencia llegan en pocos tramos (auditoría A7).
    azar_calendario_n: 1000            # Calendarios al azar con el mismo % de tiempo invertido y el mismo número de entradas...
    azar_calendario_percentil_min: 90  # ...y hay que ganarle al 90 % de ellos (decidido por Ángelo: 90 %, como dice la especificación).
    bloque_dias: 20                    # Remuestreo en bloques de 20 días (rendimientos diarios y Monte Carlo en bloques).
    bootstrap_n: 2000                  # Repeticiones del remuestreo en bloques de la curva diaria.
    wf_min_operaciones_entrenamiento: 8  # En 12 meses un motor lento opera poco: con menos de 8 operaciones no se elige esa combinación.
    prueba_final_es_compuerta: false   # Mayo–octubre 2026 ya se abrió en la v1: se REPORTA, pero no decide. La prueba limpia es el papel.
    comisiones_sensibilidad: [0.075, 0.10, 0.15]  # Auditoría A9: comisión por lado.
    orden_azar_n: 200                  # Auditoría A8: veces que se elige al azar entre señales del mismo día.
  compuertas:
    min_operaciones_oos: 100           # Mínimo de operaciones fuera de muestra.
    factor_ganancia_min: 1.3           # Lo ganado debe ser al menos 1.3 veces lo perdido.
    expectativa_min_r: 0.10            # Ganancia promedio por operación, ya con costos, de al menos +0.1R.
    ventanas_positivas_min_pct: 60     # Positiva en al menos 60 % de las ventanas de walk-forward.
    caida_p95_max_pct: 25              # Caída máxima en el peor 5 % de Monte Carlo no mayor a 25 %.
    azar_percentil_min: 90             # Debe superar al 90 % de las simulaciones al azar.
    papel_dias_min: 30                 # En papel: al menos 30 días...
    papel_operaciones_min: 30          # ...y 30 operaciones, dentro de la banda 5–95 % de Monte Carlo.
    vivo_operaciones_min: 100          # Para subir de VIVA_MINI a VIVA: 100 operaciones reales en banda.
    escalon_capital_max: 2.0           # El capital crece como máximo al doble por escalón...
    escalon_dias_min: 30               # ...con al menos 30 días entre escalones.
    apagado_ultimas_n: 30              # Si la expectativa de las últimas 30 operaciones es negativa → regresa a PAPEL.

ronda:
  frecuencia: "diaria"                 # v2: UNA sola ronda al día. Los motores deciden con velas diarias y los stops viven en Binance.
  hora_utc: "00:10"                    # 00:10 UTC = 6:10 p. m. en CDMX (10 minutos después del cierre diario).
  minuto_minimo_utc: 5                 # Antes de las 00:05 UTC la ronda se niega (la vela diaria puede no estar completa en Binance).
  max_retraso_min: 120                 # Más de 120 minutos después de hora_utc = FUERA DE HORA: se revisan stops, pero sin compras.
  tiempo_max_segundos: 60              # La ronda debe terminar en menos de 60 segundos.
  vigencia_boleto_horas: 24            # Una compra vale 24 h desde las 00:00 UTC del día en que corre la ronda: vence a las 00:00 UTC
                                       # del día siguiente (6:00 p. m. CDMX). Si no se llenó, el Ejecutor la cancela; vencida, no se pone.

# v2: dos carteras de PAPEL para decidir con datos (decisión de Ángelo: correr las dos).
# Cada una cambia solo estos valores del bloque `riesgo`; lo demás es igual.
carteras:
  capital_inicial: 46.18               # Mismo capital de arranque para A, B y las referencias R0, R1 y R2 en papel.
  A:
    nombre: "Cartera A (cuidadosa)"
    riesgo_por_operacion_pct: 1.0
    calor_total_max_pct: 4.0
    tope_diario_pct: 3.0
    tope_semanal_pct: 6.0
    caida_max_desde_pico_pct: 15.0     # Freno total.
    exposicion_max_posicion_spot_pct: 30.0
    posiciones_max: {normales: 3, memes: 0, futuros: 0}   # Memes y Futuros apagados en la v2.
  B:
    nombre: "Cartera B (suelta)"
    riesgo_por_operacion_pct: 2.0
    calor_total_max_pct: 6.0
    tope_diario_pct: 4.0
    tope_semanal_pct: 8.0
    caida_max_desde_pico_pct: 30.0
    exposicion_max_posicion_spot_pct: 30.0
    posiciones_max: {normales: 2, memes: 0, futuros: 0}   # Decidido por Ángelo (10 nov 2026): 2 posiciones para que el peor día (2 × 2 % = 4 %) quepa en el tope diario.
  C:
    nombre: "Cartera C (por exposición)"
    # Pedida por Ángelo (10 nov 2026): con 46.18 USDT, A y B no llegan al mínimo de Binance con M0.
    # C compra lo más grande que permite el tope de 30 % (≈ 13.85 USDT; a la mitad si la volatilidad está ALTA).
    tamano: "exposicion"               # En vez de riesgo % ÷ stop. Solo esta cartera.
    riesgo_por_operacion_pct: 4.5      # Lo que REALMENTE arriesga: 30 % del capital × stop de catástrofe de 15 %.
    calor_total_max_pct: 4.5
    tope_diario_pct: 4.5
    tope_semanal_pct: 9.0
    caida_max_desde_pico_pct: 30.0     # Decidido por Ángelo: freno de 30 % (como B). C queda EXENTA de "freno ≥ 15 × riesgo" porque no se dimensiona por riesgo.
    exposicion_max_posicion_spot_pct: 30.0
    posiciones_max: {normales: 1, memes: 0, futuros: 0}   # Una posición: la de BTC de M0.

# Cómo se llenan las órdenes (papel y backtest con llenado realista). Las mismas cifras van en los boletos.
ejecucion:
  limite_compra_pct: 0.3               # La compra es LIMIT a cierre × (1 + 0.3 %). Si la apertura abre más arriba, NO se llena.
  limite_stop_pct: 0.5                 # El STOP_LOSS_LIMIT tiene su límite 0.5 % abajo del stop. Si el precio abre más abajo del límite, el stop NO se llena.

conciliacion:
  tolerancia_usdt: 0.10                # Si Binance y la bitácora difieren más de 0.10 USDT → PAUSA automática.

vetos:                                 # Límites a los vetos que escribe CENTINELA en datos/vetos.json.
  max_horas: 72                        # Un veto no puede vencer a más de 72 horas; si hace falta más, se renueva.
  razon_max_caracteres: 200            # Razón/nota: máximo 200 caracteres, sin saltos de línea y sin enlaces (http).

control_cambios:
  dia_ventana: "domingo"               # Las reglas solo se cambian los domingos (ventana semanal).
  solo_reducir_riesgo_entre_semana: true  # A mitad de semana solo se aceptan cambios que bajen el riesgo.

plan_grok:
  costo_mxn_mes: 300                   # Lo que cuesta Grok Bot al mes.
  inicio_ciclo: "2026-11-09"           # Primer día del primer ciclo de 30 días.
  dias_ciclo: 30                       # Duración de cada ciclo.
  meta_dia_mxn: 10                     # Meta diaria en pesos.
  meta_semana_mxn: 70                  # Meta semanal en pesos.
  min_operaciones_veredicto: 30        # Con menos de 30 operaciones el veredicto es "preliminar".

reportes:
  hora_diario: "20:30"                 # Reporte diario a las 8:30 p. m. (CDMX).
  dia_semanal: "domingo"               # Reporte semanal los domingos.
  lineas_max_resumen: 8                # El resumen de cada ronda tiene máximo 8 líneas.
