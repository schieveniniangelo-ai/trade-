# Arreglo 98: corre todas las pruebas en cada push a codex/marea-v2.
# Instala desde requirements.lock (versiones exactas) con la misma versión de Python que la computadora de Grok Bot.
# Todo es PAPEL: no usa llaves ni secretos de ningún tipo.
name: pruebas

on:
  push:
    branches: [codex/marea-v2]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar desde requirements.lock
        run: python -m pip install -r requirements.lock
      - name: pytest completo con cobertura del paquete
        shell: bash   # con bash, GitHub usa pipefail: si pytest falla, el paso falla aunque vaya por tee
        run: python -m pytest -p no:cacheprovider --cov=sobreviviente --cov-report=term | tee pytest-salida.txt
      # Los logs piden iniciar sesión; los avisos se ven en la página del run sin iniciar sesión.
      - name: Resultado a la vista
        if: always()
        shell: bash
        run: |
          resumen=$(grep -E "^=+ .*(passed|failed|error).* =+$" pytest-salida.txt | tail -1 | tr -d '=' | xargs || true)
          cobertura=$(awk '/^TOTAL /{printf "%.2f %% (%s sentencias, %s sin cubrir)", ($2-$3)*100/$2, $2, $3}' pytest-salida.txt || true)
          echo "::notice title=pytest::${resumen:-sin resumen}; cobertura del paquete ${cobertura:-sin dato}"
