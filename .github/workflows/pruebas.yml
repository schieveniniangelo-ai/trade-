# Arreglo 98: corre todas las pruebas en cada push a codex/marea-v2.
# Instala desde requirements.lock (versiones exactas) con la misma versión de Python que la computadora de Grok Bot.
# Todo es PAPEL: no usa llaves ni secretos de ningún tipo.
name: pruebas

on:
  push:
    branches: [codex/marea-v2]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar desde requirements.lock
        run: python -m pip install -r requirements.lock
      - name: pytest completo con cobertura del paquete
        run: python -m pytest -p no:cacheprovider --cov=sobreviviente --cov-report=term
